<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Время и погода</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Nunito:wght@700;800&display=swap" media="print" onload="this.media='all'">
<style>
  :root { --rd: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", -apple-system, "Inter", "Segoe UI", Arial, sans-serif; --sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }

  #stage { position: absolute; left: 0; top: 0; width: 1152px; height: 256px; transform-origin: 0 0; overflow: hidden; background: #000; }
  canvas { position: absolute; left: 0; top: 0; width: 1152px; height: 256px; }
  #vid { position: absolute; left: 0; top: 0; width: 1152px; height: 256px; object-fit: cover; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; }
  #wrap { position: absolute; left: 0; top: 0; width: 1152px; height: 256px; color: #fff; font-family: var(--sf); -webkit-font-smoothing: antialiased; letter-spacing: -0.1px; text-shadow: 0 1px 12px rgba(0,30,90,0.28); }

  .slide { position: absolute; left: 0; top: 0; width: 1152px; height: 256px; opacity: 0; transition: opacity 0.8s ease; pointer-events: none; }
  .slide.on { opacity: 1; }

  /* ===== карточка-виджет: матовое стекло, как в iOS ===== */
  .card { position: absolute; top: 14px; height: 228px; box-sizing: border-box; border-radius: 28px; overflow: hidden;
    background: linear-gradient(160deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.05) 100%), rgba(18,54,126,0.28);
    -webkit-backdrop-filter: blur(26px) saturate(170%) brightness(0.96); backdrop-filter: blur(26px) saturate(170%) brightness(0.96);
    border: 1px solid rgba(255,255,255,0.34);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), inset 0 0 0 1px rgba(255,255,255,0.05), 0 14px 36px rgba(8,30,80,0.34); }
  .nofx .card { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(20,56,130,0.5); }
  .nofx * { animation: none !important; }

  .lbl { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.85; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .lbl svg { width: 13px; height: 13px; flex: none; }

  .rise { opacity: 0; transform: translateY(10px); transition: opacity 0.7s ease, transform 0.8s cubic-bezier(0.2,0.8,0.2,1); }
  .slide.on .rise { opacity: 1; transform: none; }
  .slide.on .d1 { transition-delay: 0.05s; } .slide.on .d2 { transition-delay: 0.12s; } .slide.on .d3 { transition-delay: 0.19s; }
  .slide.on .d4 { transition-delay: 0.26s; } .slide.on .d5 { transition-delay: 0.33s; } .slide.on .d6 { transition-delay: 0.4s; }

  svg.wi { fill: none; stroke: none; overflow: visible; filter: drop-shadow(0 3px 4px rgba(0,20,60,0.22)); }
  .dropf { animation: dropf 1.2s linear infinite; }
  .dropf:nth-of-type(2n) { animation-delay: -0.4s; } .dropf:nth-of-type(3n) { animation-delay: -0.8s; }
  @keyframes dropf { 0% { transform: translateY(-4px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(8px); opacity: 0; } }
  .flk { animation: flk 3.2s steps(1) infinite; }
  @keyframes flk { 0%, 86%, 100% { opacity: 1; } 89% { opacity: 0.4; } 92% { opacity: 1; } 95% { opacity: 0.55; } }
  /* лёгкое «дыхание» тумана поверх иконки */
  .fogl { animation: fogl 6s ease-in-out infinite; }
  .fogl:nth-of-type(2n) { animation-delay: -2s; animation-direction: reverse; }
  .fogl:nth-of-type(3n) { animation-delay: -4s; }
  @keyframes fogl { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(4px); } }

  /* ===== ЭКРАН 1 ===== */
  #cClock { position: absolute; left: 30px; top: 0; width: 350px; height: 256px; }
  #dateRow { position: absolute; left: 6px; top: 50px; font-size: 24px; white-space: nowrap; font-family: var(--rd); }
  #wday { font-weight: 600; }
  #dateTxt { font-weight: 600; opacity: 0.75; margin-left: 10px; }
  #time { position: absolute; left: 0; top: 84px; font-family: var(--rd); font-size: 122px; font-weight: 800; letter-spacing: -2px; color: rgba(255,255,255,0.94); line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap;
    text-shadow: 0 2px 18px rgba(0,20,70,0.30); }
  #time .col { display: inline-block; margin: 0 1px; transition: opacity 0.25s; position: relative; top: -8px; }
  #time .col.off { opacity: 0.3; }

  #cNow { position: absolute; left: 396px; top: 0; width: 310px; height: 256px; text-align: center; }
  #loc { position: absolute; left: 0; right: 0; top: 24px; font-size: 11px; font-weight: 600; letter-spacing: 0.9px; opacity: 0.6; }
  #city { position: absolute; left: 0; right: 0; top: 32px; font-size: 26px; font-weight: 500; letter-spacing: -0.3px; }
  #temp { position: absolute; left: 0; right: 0; top: 64px; padding-left: 14px; font-size: 104px; font-weight: 200; letter-spacing: -3px; line-height: 1; white-space: nowrap; text-shadow: 0 2px 14px rgba(0,20,70,0.18); }
  #desc { position: absolute; left: 0; right: 0; top: 176px; font-size: 20px; font-weight: 500; white-space: nowrap; }
  #range { position: absolute; left: 0; right: 0; top: 206px; font-size: 22px; font-weight: 500; opacity: 0.9; white-space: nowrap; }
  #range b { font-weight: 500; }

  #cHours { left: 724px; width: 414px; padding: 14px 16px; }
  #cHours .lbl { padding: 0 6px 10px; border-bottom: 1px solid rgba(255,255,255,0.22); }
  #hrs { position: absolute; left: 10px; right: 10px; top: 46px; bottom: 10px; display: flex; align-items: stretch; }
  .hc { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 1px; border-radius: 22px; }
  .hc { min-width: 0; }
  .hc .t { font-size: 17px; font-weight: 500; opacity: 0.75; }
  .hc:first-child .t { opacity: 1; font-weight: 700; font-size: 14px; letter-spacing: -0.2px; white-space: nowrap; line-height: 20px; }
  .hc .t { line-height: 20px; }
  .hc svg { width: 52px; height: 42px; margin: 12px 0 10px; }
  .hc b { font-size: 28px; font-weight: 500; letter-spacing: -0.5px; }
  .hc .pp { font-size: 14px; font-weight: 700; color: #8fdcff; height: 16px; margin-top: 6px; }

  /* ===== ЭКРАН 2 ===== */
  #cDays { left: 14px; width: 560px; padding: 16px 22px; }
  #drows { position: absolute; left: 22px; right: 22px; top: 46px; bottom: 10px; display: flex; flex-direction: column; justify-content: space-around; }
  .row { display: flex; align-items: center; height: 32px; position: relative; }
  .row + .row::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 1px; background: rgba(255,255,255,0.18); }
  .row .dn { width: 110px; font-size: 20px; font-weight: 600; }
  .row svg { width: 40px; height: 32px; margin-right: 18px; flex: none; }
  .row .lo { width: 48px; text-align: right; font-size: 20px; font-weight: 500; opacity: 0.55; font-variant-numeric: tabular-nums; }
  .row .hi { width: 48px; text-align: left; font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(0,0,0,0.22); margin: 0 12px; position: relative; overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #64d2ff, #8ee08e 45%, #ffd60a 75%, #ff9f0a); }

  #tiles { position: absolute; left: 588px; top: 0; width: 550px; height: 256px; }
  .tile { position: absolute; width: 176px; height: 107px; padding: 13px 16px 12px; border-radius: 22px; display: flex; flex-direction: column; justify-content: space-between; }
  .tile .v { font-size: 34px; font-weight: 500; letter-spacing: -0.8px; white-space: nowrap; line-height: 1; }
  .tile .v small { font-size: 16px; font-weight: 500; letter-spacing: 0; opacity: 0.7; margin-left: 3px; }
  .tile .s { font-size: 13px; font-weight: 500; opacity: 0.88; white-space: nowrap; }
  .tile .uvb { position: relative; flex: none; height: 4px; border-radius: 2px; background: linear-gradient(90deg,#5ee27a,#ffe14a,#ff9a3d,#ff4d4d,#b04dff); }
  .tile .uvb i { position: absolute; top: -2px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,0.25); }
  .tile .sun2 { font-size: 22px; font-weight: 500; letter-spacing: -0.3px; line-height: 1.25; white-space: nowrap; }
  .tile .sun2 span { font-size: 12px; opacity: 0.6; font-weight: 500; margin-right: 8px; letter-spacing: 0; }
  .tile .gauge { position: absolute; left: 16px; right: 16px; bottom: 34px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.22); overflow: hidden; }
  .tile .gauge i { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 2px; background: #64d2ff; transition: width 1s ease; }

  /* большие карточки: влажность / ощущается / ветер */
  .tile.big { height: 228px; padding: 20px 18px 20px 20px; border-radius: 28px; justify-content: space-between; }
  .tile.big .lbl { font-size: 13px; letter-spacing: 0.6px; }
  .tile.big .lbl svg { width: 16px; height: 16px; }
  .tile.big .v { font-size: 58px; font-weight: 300; letter-spacing: -2px; line-height: 1; text-shadow: 0 2px 14px rgba(0,20,70,0.18); }
  .tile.big .v small { font-size: 20px; font-weight: 500; letter-spacing: 0; margin-left: 4px; opacity: 0.75; }
  .tile.big .s { font-size: 15px; font-weight: 500; opacity: 0.92; text-align: center; }
  .tile.big .mid { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .tile.big .mid .meter { align-self: stretch; }
  .tile.big .meter { position: relative; height: 6px; border-radius: 3px; background: rgba(0,0,0,0.24); margin-top: 16px; }
  .tile.big .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 3px; transition: width 1s ease; }
  .tile.big .meter.ghost { visibility: hidden; }
  .tile.big .meter.hum i { background: linear-gradient(90deg, #64d2ff, #b9ecff); }
  .tile.big .meter.wnd i { background: linear-gradient(90deg, #bfe6ff, #ffffff); }
  .tile.big .wd { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
  .tile.big .wd svg { width: 16px; height: 16px; transition: transform 1s ease; }

  /* ===== ЭКРАН 3 ===== */
  #cSun { left: 14px; width: 372px; padding: 16px 20px; }
  #sunSvg { position: absolute; left: 26px; top: 40px; width: 320px; height: 150px; overflow: visible; }
  #sunT { position: absolute; left: 22px; right: 22px; bottom: 14px; display: flex; justify-content: space-between; font-size: 21px; font-weight: 500; letter-spacing: -0.3px; }
  #sunT span { font-size: 11px; opacity: 0.6; font-weight: 600; display: block; letter-spacing: 0.5px; margin-bottom: 1px; }
  #sunT div:last-child { text-align: right; }
  #sunMid { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 12px; opacity: 0.7; line-height: 1.25; }
  #sunMid b { display: block; font-size: 19px; font-weight: 500; opacity: 1; letter-spacing: -0.2px; }

  #cMoon { left: 400px; width: 196px; padding: 16px 20px; text-align: center; }
  #moonSvg { position: absolute; left: 48px; top: 42px; width: 100px; height: 100px; overflow: visible; filter: drop-shadow(0 4px 6px rgba(5,20,60,0.3)); }
  #moonN { position: absolute; left: 0; right: 0; top: 156px; font-size: 19px; font-weight: 500; }
  #moonS { position: absolute; left: 0; right: 0; top: 186px; font-size: 13px; opacity: 0.7; }

  #cWind { left: 610px; width: 196px; padding: 16px 20px; }
  #compass { position: absolute; left: 32px; top: 46px; width: 132px; height: 132px; overflow: visible; }
  #compS { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 13px; opacity: 0.75; white-space: nowrap; }

  #tiles3 { position: absolute; left: 820px; top: 0; width: 318px; height: 256px; }
  #tiles3 .tile { width: 154px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gSun" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#fff3a6"/><stop offset="0.55" stop-color="#ffd60a"/><stop offset="1" stop-color="#ff9f0a"/></radialGradient>
    <radialGradient id="gGlow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe680" stop-opacity="0.6"/><stop offset="0.5" stop-color="#ffd60a" stop-opacity="0.2"/><stop offset="1" stop-color="#ffd60a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gGlowM" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#dfe8ff" stop-opacity="0.4"/><stop offset="1" stop-color="#dfe8ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="gPuffL" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="80"><stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#f2f6fc"/><stop offset="1" stop-color="#d6e2f2"/></linearGradient>
    <linearGradient id="gPuffD" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="80"><stop offset="0" stop-color="#d3d9e4"/><stop offset="0.6" stop-color="#aab4c8"/><stop offset="1" stop-color="#8793ae"/></linearGradient>
    <radialGradient id="gMoon" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#fffef2"/><stop offset="0.6" stop-color="#e9ecf6"/><stop offset="1" stop-color="#b3bfdc"/></radialGradient>
    <linearGradient id="gMoonI" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#fffdea"/><stop offset="1" stop-color="#c3cdea"/></linearGradient>
    <linearGradient id="gBolt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
    <linearGradient id="gArc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb347"/><stop offset="0.5" stop-color="#ffe566"/><stop offset="1" stop-color="#ff8a4a"/></linearGradient>
    <radialGradient id="gDot" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#ffe14a"/><stop offset="1" stop-color="#ff9f0a"/></radialGradient>
    <linearGradient id="gFog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="0.25" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.75" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/></linearGradient>
    <mask id="mMoon" maskUnits="userSpaceOnUse" x="-60" y="-60" width="120" height="120"><rect x="-60" y="-60" width="120" height="120" fill="#fff"/><circle cx="24" cy="-14" r="36" fill="#000"/></mask>
  </defs>
</svg>

<div id="stage">
  <canvas id="bg" width="1152" height="256"></canvas>
  <video id="vid" muted playsinline loop></video>
  <div id="wrap">

    <!-- ЭКРАН 1 -->
    <div id="s1" class="slide on">
      <div id="cClock" class="rise d1">
        <div id="dateRow"><span id="wday">&nbsp;</span><span id="dateTxt">&nbsp;</span></div>
        <div id="time">--<span class="col">:</span>--</div>
      </div>

      <div id="cNow" class="rise d2">
        <div id="city">Тирасполь</div>
        <div id="temp">--°</div>
        <div id="desc">загрузка…</div>
        <div id="range"></div>
      </div>

      <div id="cHours" class="card rise d3">
        <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Почасовой прогноз</div>
        <div id="hrs"></div>
      </div>
    </div>

    <!-- ЭКРАН 2 -->
    <div id="s2" class="slide">
      <div id="cDays" class="card rise d1">
        <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Прогноз на 5 дней</div>
        <div id="drows"></div>
      </div>

      <div id="tiles">
        <div class="card tile big rise d2" style="left:0;top:14px">
          <div class="lbl"><svg viewBox="0 0 24 24" fill="#8fd4ff"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0013 0C18.5 10 12 2.5 12 2.5z"/></svg>Влажность</div>
          <div class="mid"><div class="v" id="hum">--</div><div class="meter hum"><i id="humBar"></i></div></div>
          <div class="s" id="humS">&nbsp;</div>
        </div>
        <div class="card tile big rise d3" style="left:187px;top:14px">
          <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="#ffb27a" stroke-width="2.4" stroke-linecap="round"><path d="M10 14.5V5a2 2 0 014 0v9.5a4 4 0 11-4 0z"/></svg>Ощущается</div>
          <div class="mid"><div class="v" id="feels">--</div><div class="meter ghost"></div></div>
          <div class="s" id="feelsS">&nbsp;</div>
        </div>
        <div class="card tile big rise d4" style="left:374px;top:14px">
          <div class="lbl"><svg viewBox="0 0 24 24" fill="none" stroke="#bfe6ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11a3 3 0 10-3-3M3 12h16a3 3 0 11-3 3M3 16h8a3 3 0 11-3 3"/></svg>Ветер<span class="wd"><svg id="windArrow" viewBox="0 0 24 24"><path d="M12 3l6 16-6-4-6 4z" fill="#fff"/></svg></span></div>
          <div class="mid"><div class="v" id="wind">--</div><div class="meter wnd"><i id="windBar"></i></div></div>
          <div class="s" id="dir">&nbsp;</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function () {

  var LAT = 46.84, LON = 29.58;
  var REFRESH_MIN = 5, STALE_MIN = 45, SLIDE_SEC_DEFAULT = 12, FPS = 24;
  var SW = 1152, SH = 256;
  var FOG_VIS = 2000; /* видимость ниже этого значения (метры) = туман */

  var params = {};
  (location.search || '').replace(/^\?/, '').split('&').forEach(function (p) {
    var kv = p.split('=');
    if (kv[0]) params[kv[0]] = decodeURIComponent(kv[1] || '');
  });
  /* ?blur=0 — без размытия стекла и анимаций (для слабых устройств) */
  if (params.blur === '0' || params.fx === '0') document.body.className = 'nofx';

  var stage = document.getElementById('stage');
  function fit() {
    var w = window.innerWidth || SW, h = window.innerHeight || SH;
    var s = Math.min(w / SW, h / SH);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = Math.round((w - SW * s) / 2) + 'px';
    stage.style.top = Math.round((h - SH * s) / 2) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  var DUMMY = { style: {}, className: '', innerHTML: '', textContent: '' };
  function $(id) { return document.getElementById(id) || DUMMY; }
  function setT(id, v) { var e = $(id); if (e) e.textContent = v; }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  /* ---------- время (Кишинёв, с учётом летнего времени) ---------- */
  function lastSunday(y, m) {
    var d = new Date(Date.UTC(y, m + 1, 0, 1, 0, 0));
    d.setUTCDate(d.getUTCDate() - d.getUTCDay());
    return d.getTime();
  }
  function localNow() {
    var now = Date.now(), y = new Date(now).getUTCFullYear();
    var dst = now >= lastSunday(y, 2) && now < lastSunday(y, 9);
    return new Date(now + (dst ? 3 : 2) * 3600000);
  }
  var DAYS = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  var DAYS_SHORT = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

  var lastMin = -1;
  function tickClock() {
    var d = localNow(), m = d.getUTCMinutes(), s = d.getUTCSeconds();
    if (m !== lastMin) {
      lastMin = m;
      $('time').innerHTML = pad(d.getUTCHours()) + '<span class="col" id="colon">:</span>' + pad(m);
      setT('wday', DAYS[d.getUTCDay()]);
      setT('dateTxt', d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]);
    }
    var c = $('colon'); if (c) c.className = 'col' + (s % 2 ? ' off' : '');
  }
  setInterval(tickClock, 1000); tickClock();

  /* ---------- описание и иконки ---------- */
  var DESC = {

    if (!qFixed && lastT && gap < 1000) {
      slowSum += gap; slowN++;
      if (slowN >= 45) { if (slowSum / slowN > 1.6 * 1000 / FPS && qLevel < 3) { qLevel++; applyQ(); } slowN = 0; slowSum = 0; }
    }
    var dt = Math.min(0.2, (ts - lastT) / 1000 || 0.04); lastT = ts;
    if (!hasGL) { fallbackBg(); return; }

    var T = targets(), k = 1 - Math.exp(-dt / 1.6), key;
    for (key in T) SKY[key] += (T[key] - SKY[key]) * k;
    var sp = sunPos(); SKY.sx = sp[0]; SKY.sy = sp[1];
    SKY.drift += dt * (5 + (weather.wind || 3) * 2.2);

    var now = Date.now();
    if (weather.cat === 'storm' && now > nextFlash) {
      SKY.flash = 1; SKY.bx = 0.12 + Math.random() * 0.76; bolt = makeBolt(SKY.bx * SW); nextFlash = now + 4000 + Math.random() * 5000;
      if (Math.random() < 0.5) setTimeout(function () { SKY.flash = 0.9; }, 140);
    }
    SKY.flash *= 0.88; if (SKY.flash < 0.01) SKY.flash = 0;
    render(((now - t0) / 1000) % 6000, dt);
  }

  /* необязательно: настоящее видео неба. Файлы в папку bg/ и ?video=1 */
  var vidKey = '';
  function updateVideo() {
    if (params.video !== '1') return;
    var key = themeKey(); if (key === vidKey) return; vidKey = key;
    vid.style.opacity = 0;
    vid.muted = true;
    vid.onerror = function () { vid.style.opacity = 0; };
    vid.oncanplay = function () { vid.style.opacity = 1; var p = vid.play(); if (p && p.catch) p.catch(function () {}); };
    vid.src = 'bg/' + key + '.mp4';
  }
  setInterval(updateVideo, 2000);

  /* ---------- смена экранов (3 штуки) ---------- */
  var SLIDE_SEC = parseInt(params.sec, 10) || SLIDE_SEC_DEFAULT;
  var slides = [$('s1'), $('s2')], TOTAL = slides.length, cur = 0, updateReady = false;
  function showSlide(i) {
    cur = i;
    for (var j = 0; j < slides.length; j++) slides[j].className = (j === i) ? 'slide on' : 'slide';
    try { localStorage.setItem('ws_last_slide', String(i)); } catch (e) {}
  }
  if (params.slide === 'time') showSlide(0);
  else if (params.slide === 'weather') showSlide(1);
  else {
    var start = 0;
    try { start = ((parseInt(localStorage.getItem('ws_last_slide'), 10) || 0) + 1) % TOTAL; } catch (e) {}
    if (start > 0 && !weather.ok && !loadCache()) start = 0;
    showSlide(start);
    setInterval(function () {
      var next = (cur + 1) % TOTAL;
      if (next > 0 && !weatherFresh()) next = 0;
      if (next === 0 && updateReady && navigator.onLine !== false) { location.replace(location.pathname + '?v=' + Date.now()); return; }
      showSlide(next);
    }, SLIDE_SEC * 1000);
  }

  requestAnimationFrame(frame);
  loadWeather();

  var bootDay = localNow().getUTCDate();
  setInterval(function () {
    var d = localNow();
    if (d.getUTCDate() !== bootDay && d.getUTCHours() >= 4 && navigator.onLine !== false && weatherFresh()) location.reload();
  }, 60000);

  function checkUpdate() {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', location.pathname + '?chk=' + Date.now(), true); xhr.timeout = 15000;
      xhr.onload = function () {
        try {
          if (xhr.status !== 200) return;
          var lm = xhr.getResponseHeader('Last-Modified'); if (!lm) return;
          var srv = new Date(lm).getTime(), mine = new Date(document.lastModified).getTime();
          if (isNaN(srv) || isNaN(mine)) return;
          var seen = localStorage.getItem('ws_upd');
          if (Math.abs(srv - mine) > 2000 && seen !== lm) { localStorage.setItem('ws_upd', lm); updateReady = true; }
        } catch (e) {}
      };
      xhr.send();
    } catch (e) {}
  }
  setTimeout(checkUpdate, 60000);
  setInterval(checkUpdate, 30 * 60000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
