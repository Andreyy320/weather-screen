<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Время и погода</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }

  #stage { position: absolute; left: 0; top: 0; width: 1152px; height: 256px;
    transform-origin: 0 0; overflow: hidden; background: #000; }
  canvas { position: absolute; left: 0; top: 0; width: 1152px; height: 256px; }

  #wrap { position: absolute; left: 0; top: 0; width: 1152px; height: 256px; color: #fff;
    font-family: "Inter", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    text-shadow: 0 1px 6px rgba(10,30,70,0.25); }

  .slide { position: absolute; left: 0; top: 0; width: 1152px; height: 256px;
    opacity: 0; transition: opacity 0.9s ease; }
  .slide.on { opacity: 1; }

  /* появление элементов */
  .rise { opacity: 0; transform: translateY(14px); transition: opacity 0.9s ease, transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .slide.on .rise { opacity: 1; transform: none; }
  .slide.on .d1 { transition-delay: 0.08s; }
  .slide.on .d2 { transition-delay: 0.16s; }
  .slide.on .d3 { transition-delay: 0.24s; }
  .slide.on .d4 { transition-delay: 0.32s; }
  .slide.on .d5 { transition-delay: 0.40s; }

  svg.wi { fill: none; stroke: none; filter: drop-shadow(0 5px 7px rgba(10,30,70,0.35)); }

  /* ================= ЭКРАН 1: СЕЙЧАС ================= */
  #date { position: absolute; left: 60px; top: 16px; font-size: 20px; font-weight: 400; opacity: 0.9; white-space: nowrap; letter-spacing: 0.2px; }
  #date b { font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 10px; }
  #city { position: absolute; left: 60px; top: 42px; font-size: 32px; font-weight: 600; letter-spacing: -0.3px; }
  #temp { position: absolute; left: 50px; top: 76px; font-size: 134px; font-weight: 200; line-height: 1;
    letter-spacing: -5px; white-space: nowrap; }
  #cond { position: absolute; left: 60px; top: 214px; font-size: 24px; font-weight: 500; white-space: nowrap; }
  #cond span { font-weight: 300; opacity: 0.8; margin-left: 12px; }

  #hero { position: absolute; left: 352px; top: 6px; width: 290px; height: 244px; }
  #hero .glow { position: absolute; left: -30px; top: -30px; right: -30px; bottom: -30px;
    background: radial-gradient(circle at 50% 52%, rgba(255,255,255,0.28), rgba(255,255,255,0) 62%); }
  #icon { position: absolute; left: 0; top: 0; width: 290px; height: 244px; }
  #icon svg { width: 100%; height: 100%; overflow: visible; animation: bob 7s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  #pHours { position: absolute; left: 650px; top: 14px; width: 462px; height: 156px; border-radius: 30px; overflow: hidden;
    background: linear-gradient(160deg, rgba(255,255,255,0.26), rgba(255,255,255,0.08));
    border: 1px solid rgba(255,255,255,0.3);
    box-shadow: 0 10px 28px rgba(0,0,0,0.26), inset 0 1px 0 rgba(255,255,255,0.4); }
  #pHours .curve { position: absolute; left: 0; top: 0; }
  .hc { position: absolute; top: 0; height: 156px; }
  .hc .t { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: 500; opacity: 0.88; white-space: nowrap; }
  .hc svg { position: absolute; left: 50%; top: 32px; width: 70px; height: 56px; margin-left: -35px; }
  .hc b { position: absolute; left: 0; right: 0; top: 126px; text-align: center; font-size: 22px; font-weight: 400; letter-spacing: -0.3px; }

  #stats { position: absolute; left: 650px; top: 184px; width: 462px; height: 60px; display: flex; justify-content: space-between; }
  .st { width: 86px; text-align: center; }
  .st svg { display: block; width: 22px; height: 22px; margin: 0 auto 1px; filter: drop-shadow(0 2px 3px rgba(10,30,70,0.35)); }
  .st b { display: block; font-size: 19px; font-weight: 500; line-height: 1.2; white-space: nowrap; }
  .st i { display: block; font-style: normal; font-size: 12px; font-weight: 400; opacity: 0.75; line-height: 1.2; white-space: nowrap; }

  /* ================= ЭКРАН 2: 5 ДНЕЙ ================= */
  #days { position: absolute; left: 56px; top: 12px; width: 1040px; height: 232px; display: flex; }
  .dc { width: 208px; height: 232px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding-top: 8px;
    border-left: 1px solid rgba(255,255,255,0.2); }
  .dc:first-child { border-left: none; }
  .dc .t { font-size: 24px; font-weight: 500; line-height: 1.2; opacity: 0.92; }
  .dc svg { width: 132px; height: 106px; margin: 4px 0 4px; }
  .dc b { font-size: 38px; font-weight: 300; line-height: 1.15; letter-spacing: -1px; }
  .dc .lo { font-size: 24px; font-weight: 400; line-height: 1.2; opacity: 0.65; }
</style>
</head>
<body>

<!-- общие градиенты и маски для иконок -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gSun" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fffbd0"/><stop offset="0.35" stop-color="#ffe066"/><stop offset="0.75" stop-color="#ffb21e"/><stop offset="1" stop-color="#ff8a00"/>
    </radialGradient>
    <radialGradient id="gGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a0" stop-opacity="0.85"/><stop offset="0.4" stop-color="#ffd45a" stop-opacity="0.32"/><stop offset="1" stop-color="#ffd45a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gGlowM" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#dfe8ff" stop-opacity="0.5"/><stop offset="1" stop-color="#dfe8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gPuffL" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#f3f7ff"/><stop offset="0.85" stop-color="#cbd9f0"/><stop offset="1" stop-color="#a9bfdf"/>
    </radialGradient>
    <radialGradient id="gPuffD" cx="38%" cy="28%" r="78%">
      <stop offset="0" stop-color="#d4dbea"/><stop offset="0.5" stop-color="#a3aec8"/><stop offset="0.85" stop-color="#7684a6"/><stop offset="1" stop-color="#5a6a8e"/>
    </radialGradient>
    <linearGradient id="gBaseL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6eefa"/><stop offset="1" stop-color="#9fb5da"/>
    </linearGradient>
    <linearGradient id="gBaseD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f9cb8"/><stop offset="1" stop-color="#4b5878"/>
    </linearGradient>
    <linearGradient id="gMoon" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffdea"/><stop offset="1" stop-color="#c3cdea"/>
    </linearGradient>
    <linearGradient id="gBolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a0"/><stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="gDrop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe6ff"/><stop offset="1" stop-color="#2f8fff"/>
    </linearGradient>
    <linearGradient id="gTherm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mMoon" maskUnits="userSpaceOnUse" x="-60" y="-60" width="120" height="120">
      <rect x="-60" y="-60" width="120" height="120" fill="#fff"/>
      <circle cx="24" cy="-14" r="36" fill="#000"/>
    </mask>
  </defs>
</svg>

<div id="stage">
  <canvas id="bg" width="1152" height="256"></canvas>
  <div id="wrap">

    <!-- ЭКРАН 1: сейчас -->
    <div id="s1" class="slide on">
      <div id="date" class="rise"><b id="time">--:--</b><span id="dateTxt">&nbsp;</span></div>
      <div id="city" class="rise d1">Тирасполь</div>
      <div id="temp" class="rise d2">--°</div>
      <div id="cond" class="rise d3"><em id="desc" style="font-style:normal">загрузка…</em><span id="range"></span></div>

      <div id="hero" class="rise d2"><div class="glow"></div><div id="icon"></div></div>

      <div id="pHours" class="rise d3"></div>

      <div id="stats" class="rise d4">
        <div class="st">
          <svg viewBox="0 0 24 24"><path d="M12 2.5S5.5 10 5.5 14.5a6.5 6.5 0 0013 0C18.5 10 12 2.5 12 2.5z" fill="url(#gDrop)"/></svg>
          <b id="hum">--</b><i>Влажность</i>
        </div>
        <div class="st">
          <svg viewBox="0 0 24 24"><rect x="9.8" y="2.5" width="4.4" height="13" rx="2.2" fill="#e9eef7"/><rect x="11" y="8" width="2" height="9" rx="1" fill="#ff6a3d"/><circle cx="12" cy="17.5" r="4.2" fill="url(#gTherm)"/></svg>
          <b id="feels">--</b><i>Ощущается</i>
        </div>
        <div class="st">
          <svg viewBox="0 0 24 24" fill="none" stroke="#bfe6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11a3 3 0 10-3-3M3 12h16a3 3 0 11-3 3M3 16h8a3 3 0 11-3 3"/></svg>
          <b id="wind">--</b><i id="dir">Ветер</i>
        </div>
        <div class="st">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M4.5 18a8.5 8.5 0 1115 0" stroke="#bfe6ff" stroke-width="2"/><path d="M12 14l4-5" stroke="#ff8a5c" stroke-width="2.2"/><circle cx="12" cy="14" r="1.6" fill="#fff"/></svg>
          <b id="pres">--</b><i>мм рт.ст.</i>
        </div>
        <div class="st">
          <svg viewBox="0 0 24 24"><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2 2M16.7 16.7l2 2M18.7 5.3l-2 2M7.3 16.7l-2 2" stroke="#ffc83d" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="12" cy="12" r="4.6" fill="url(#gSun)"/></svg>
          <b id="uv">--</b><i>УФ-индекс</i>
        </div>
      </div>
    </div>

    <!-- ЭКРАН 2: 5 дней -->
    <div id="s2" class="slide">
      <div id="days"></div>
    </div>

  </div>
</div>

<script>
(function () {

  var CITY = 'Тирасполь';
  var LAT = 46.84, LON = 29.58;
  var REFRESH_MIN = 5;
  var STALE_MIN = 45;
  var SLIDE_SEC_DEFAULT = 12;
  var FPS = 20;
  var SUN_X = 0.44;

  var SW = 1152, SH = 256;

  var params = {};
  (location.search || '').replace(/^\?/, '').split('&').forEach(function (p) {
    var kv = p.split('=');
    if (kv[0]) params[kv[0]] = decodeURIComponent(kv[1] || '');
  });

  var stage = document.getElementById('stage');
  function fit() {
    var w = window.innerWidth || SW, h = window.innerHeight || SH;
    var s = Math.min(w / SW, h / SH);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = Math.round((w - SW * s) / 2) + 'px';
    stage.style.top = Math.round((h - SH * s) / 2) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  function $(id) { return document.getElementById(id); }
  function setT(id, v) { var e = $(id); if (e) e.textContent = v; }

  function lastSunday(y, m) {
    var d = new Date(Date.UTC(y, m + 1, 0, 1, 0, 0));
    d.setUTCDate(d.getUTCDate() - d.getUTCDay());
    return d.getTime();
  }
  function chisinauNow() {
    var now = Date.now();
    var y = new Date(now).getUTCFullYear();
    var dst = now >= lastSunday(y, 2) && now < lastSunday(y, 9);
    return new Date(now + (dst ? 3 : 2) * 3600000);
  }
  var DAYS = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  var DAYS_SHORT = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  var lastMinute = -1;
  function tickClock() {
    var d = chisinauNow(), m = d.getUTCMinutes();
    if (m !== lastMinute) {
      lastMinute = m;
      setT('time', pad(d.getUTCHours()) + ':' + pad(m));
      setT('dateTxt', DAYS[d.getUTCDay()] + ', ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]);
    }
  }
  setInterval(tickClock, 1000);
  tickClock();

  var DESC = {
    0: 'Ясно', 1: 'Преимущественно ясно', 2: 'Переменная облачность', 3: 'Пасмурно',
    45: 'Туман', 48: 'Изморозь', 51: 'Лёгкая морось', 53: 'Морось', 55: 'Сильная морось',
    56: 'Ледяная морось', 57: 'Ледяная морось', 61: 'Небольшой дождь', 63: 'Дождь', 65: 'Сильный дождь',
    66: 'Ледяной дождь', 67: 'Ледяной дождь', 71: 'Небольшой снег', 73: 'Снег', 75: 'Сильный снег',
    77: 'Снежная крупа', 80: 'Ливень', 81: 'Ливень', 82: 'Сильный ливень',
    85: 'Снегопад', 86: 'Сильный снегопад', 95: 'Гроза', 96: 'Гроза с градом', 99: 'Гроза с градом'
  };
  function categoryOf(code) {
    if (code === 0 || code === 1) return 'clear';
    if (code === 2 || code === 3) return 'clouds';
    if (code === 45 || code === 48) return 'fog';
    if (code >= 51 && code <= 67) return 'rain';
    if (code >= 80 && code <= 82) return 'rain';
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
    if (code >= 95) return 'storm';
    return 'clouds';
  }

  /* ---------- объёмные иконки в стиле Apple (облака из «пухлых» кругов) ---------- */
  function cloud(tx, ty, s, dark) {
    var P = 'url(#' + (dark ? 'gPuffD' : 'gPuffL') + ')', B = 'url(#' + (dark ? 'gBaseD' : 'gBaseL') + ')';
    return '<g transform="translate(' + tx + ' ' + ty + ') scale(' + s + ')">' +
      '<rect x="4" y="56" width="124" height="22" rx="11" fill="' + B + '"/>' +
      '<circle cx="88" cy="46" r="26" fill="' + P + '"/>' +
      '<circle cx="54" cy="40" r="28" fill="' + P + '"/>' +
      '<circle cx="30" cy="56" r="20" fill="' + P + '"/>' +
      '<circle cx="110" cy="60" r="18" fill="' + P + '"/>' +
      '<circle cx="14" cy="64" r="14" fill="' + P + '"/>' +
      '<circle cx="46" cy="62" r="16" fill="' + P + '"/>' +
      '<circle cx="78" cy="64" r="15" fill="' + P + '"/>' +
      '</g>';
  }
  function sunG(cx, cy, k) {
    var hx = cx - 14 * k, hy = cy - 16 * k;
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (98 * k) + '" fill="url(#gGlow)"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + (52 * k) + '" fill="none" stroke="#ffe27a" stroke-opacity="0.22" stroke-width="' + (8 * k) + '"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + (42 * k) + '" fill="url(#gSun)"/>' +
      '<ellipse cx="' + hx + '" cy="' + hy + '" rx="' + (15 * k) + '" ry="' + (9 * k) + '" fill="#fff" fill-opacity="0.5" transform="rotate(-35 ' + hx + ' ' + hy + ')"/>';
  }
  function moonG(cx, cy, k) {
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + (90 * k) + '" fill="url(#gGlowM)"/>' +
      '<g transform="translate(' + cx + ' ' + cy + ') scale(' + k + ')"><g mask="url(#mMoon)"><circle cx="0" cy="0" r="42" fill="url(#gMoon)"/></g></g>';
  }
  function wsvg(inner) { return '<svg class="wi" viewBox="0 0 200 160">' + inner + '</svg>'; }

  function iconOf(code, isDay) {
    var c = categoryOf(code);
    var body = function (x, y, k) { return isDay ? sunG(x, y, k) : moonG(x, y, k); };
    if (c === 'clear') {
      if (code === 1) return wsvg(body(78, 70, 0.8) + cloud(76, 84, 0.75, false));
      return wsvg(body(100, 80, 1));
    }
    if (c === 'clouds') {
      if (code === 2) return wsvg(body(74, 62, 0.85) + cloud(34, 62, 1.1, false));
      return wsvg(cloud(14, 20, 0.95, true) + cloud(58, 58, 1.1, false));
    }
    if (c === 'fog') {
      return wsvg(cloud(36, 18, 1.05, false) +
        '<path d="M40 116h110M56 130h100M48 144h90" stroke="#fff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round"/>');
    }
    if (c === 'rain') {
      return wsvg(cloud(28, 8, 1.2, true) +
        '<path d="M62 114l-8 22M92 118l-8 22M122 114l-8 22M77 138l-6 16M107 140l-6 16" stroke="#a6e0ff" stroke-width="6" stroke-linecap="round" fill="none"/>');
    }
    if (c === 'snow') {
      return wsvg(cloud(28, 8, 1.2, false) +
        '<circle cx="58" cy="118" r="5.5" fill="#fff"/><circle cx="92" cy="128" r="5.5" fill="#fff"/><circle cx="126" cy="118" r="5.5" fill="#fff"/><circle cx="74" cy="146" r="5" fill="#fff"/><circle cx="110" cy="148" r="5" fill="#fff"/>');
    }
    if (c === 'storm') {
      return wsvg(cloud(28, 6, 1.2, true) +
        '<path d="M108 84L84 122H102L92 156L134 108H114L126 84Z" fill="url(#gBolt)" stroke="#ffd34d" stroke-width="1.5" stroke-linejoin="round"/>');
    }
    return wsvg(cloud(36, 40, 1.1, false));
  }

  var weather = { cat: 'clouds', day: true, ok: false };
  var dataTs = 0;
  function weatherFresh() {
    return weather.ok && (!!params.demo || Date.now() - dataTs < STALE_MIN * 60000);
  }

  var DIRS = ['С','ССВ','СВ','ВСВ','В','ВЮВ','ЮВ','ЮЮВ','Ю','ЮЮЗ','ЮЗ','ЗЮЗ','З','ЗСЗ','СЗ','ССЗ'];
  function signed(n) { n = Math.round(n); return (n > 0 ? '+' : '') + n + '°'; }

  /* ---------- почасовой прогноз с плавной кривой ---------- */
  function renderHours(hr) {
    var n = hr.length, cw = 462 / n, i, mn = 999, mx = -999, pts = [], cols = '';
    for (i = 0; i < n; i++) { if (hr[i][1] < mn) mn = hr[i][1]; if (hr[i][1] > mx) mx = hr[i][1]; }
    for (i = 0; i < n; i++) {
      pts.push([cw * i + cw / 2, (mx === mn) ? 106 : 120 - (hr[i][1] - mn) / (mx - mn) * 26]);
      cols += '<div class="hc" style="left:' + (cw * i).toFixed(1) + 'px;width:' + cw.toFixed(1) + 'px"><span class="t">' +
        (i === 0 ? 'Сейчас' : hr[i][3].slice(0, 2)) + '</span>' + iconOf(hr[i][0], hr[i][2]) + '<b>' + signed(hr[i][1]) + '</b></div>';
    }
    var d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1), p0, p1, p2, p3;
    for (i = 0; i < n - 1; i++) {
      p0 = pts[Math.max(i - 1, 0)]; p1 = pts[i]; p2 = pts[i + 1]; p3 = pts[Math.min(i + 2, n - 1)];
      d += 'C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + ' ' +
        (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + ' ' +
        p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    var area = d + 'L' + pts[n - 1][0].toFixed(1) + ' 124L' + pts[0][0].toFixed(1) + ' 124Z';
    var dots = '';
    for (i = 0; i < n; i++) dots += '<circle cx="' + pts[i][0].toFixed(1) + '" cy="' + pts[i][1].toFixed(1) + '" r="' + (i === 0 ? 5 : 3.5) +
      '" fill="#fff"' + (i === 0 ? ' stroke="rgba(255,255,255,0.4)" stroke-width="4"' : '') + '/>';
    $('pHours').innerHTML = '<svg class="curve" width="462" height="156" viewBox="0 0 462 156"><path d="' + area + '" fill="url(#gArea)"/>' +
      '<path d="' + d + '" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="2.4" stroke-linecap="round"/>' + dots + '</svg>' + cols;
  }
  function renderDays(dy) {
    var h = '', k, p, label;
    for (k = 0; k < dy.length; k++) {
      p = dy[k][0].split('-');
      label = (k === 0) ? 'Сегодня' : DAYS_SHORT[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
      h += '<div class="dc rise d' + (k + 1) + '"><span class="t">' + label + '</span>' + iconOf(dy[k][1], true) +
        '<b>' + signed(dy[k][2]) + '</b><span class="lo">' + signed(dy[k][3]) + '</span></div>';
    }
    $('days').innerHTML = h;
  }

  function applyWeather(code, temp, feels, hum, wind, isDay, precip, cloud, uv, pres, wdir, tmax, tmin, sr, ss, hr, dy) {
    var c0 = categoryOf(code);
    if ((c0 === 'rain' || c0 === 'snow') && typeof precip === 'number' && precip < 0.1) {
      code = (cloud >= 85) ? 3 : (cloud >= 40 ? 2 : (cloud >= 15 ? 1 : 0));
    }
    weather.cat = categoryOf(code);
    weather.day = isDay;
    weather.ok = true;
    setT('temp', signed(temp));
    setT('desc', DESC[code] || 'Облачно');
    setT('range', 'Макс.:' + signed(tmax) + '  Мин.:' + signed(tmin));
    $('icon').innerHTML = iconOf(code, isDay);
    setT('feels', signed(feels));
    setT('hum', Math.round(hum) + '%');
    setT('wind', Math.round(wind) + ' м/с');
    setT('dir', 'Ветер ' + DIRS[Math.round(wdir / 22.5) % 16]);
    setT('pres', Math.round(pres * 0.750062));
    setT('uv', Math.round(uv));
    if (hr && hr.length) renderHours(hr);
    if (dy && dy.length) renderDays(dy);
    requestScene();
  }

  var CACHE_KEY = 'ws_weather_v6';
  function saveCache(arr) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), v: arr })); } catch (e) {}
  }
  function loadCache() {
    try {
      var o = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (o && o.v && Date.now() - o.ts < 60 * 60000) return o;
    } catch (e) {}
    return null;
  }

  var DEMO = {
    clear:  [0, 18, 17, 45, 3],
    clouds: [3, 9, 7, 74, 4],
    fog:    [45, 4, 2, 95, 1],
    rain:   [63, 11, 9, 88, 6],
    snow:   [73, -3, -7, 82, 5],
    storm:  [95, 20, 21, 80, 9]
  };
  function isoDate(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }

  function loadWeather() {
    if (params.demo && DEMO[params.demo]) {
      var d = DEMO[params.demo], hr = [], dy = [], i, base = chisinauNow(), codes = [d[0], 2, 3, 61, 0], tw = [0, 1, 3, 2, 0, -1];
      for (i = 0; i < 6; i++) hr.push([i % 3 === 2 ? 2 : d[0], d[1] + tw[i], params.night !== '1', pad((base.getUTCHours() + i) % 24) + ':00']);
      for (i = 0; i < 5; i++) dy.push([isoDate(new Date(base.getTime() + i * 86400000)), codes[i], d[1] + 2 - i, d[1] - 3 - i]);
      dataTs = Date.now();
      applyWeather(d[0], d[1], d[2], d[3], d[4], params.night !== '1', undefined, undefined, 3, 1021, 20, d[1] + 2, d[1] - 3, '06:47', '16:43', hr, dy);
      return;
    }
    var cached = loadCache();
    if (cached && !weather.ok) {
      dataTs = cached.ts;
      applyWeather.apply(null, cached.v);
      if (Date.now() - cached.ts < REFRESH_MIN * 60000) {
        setTimeout(loadWeather, REFRESH_MIN * 60000 - (Date.now() - cached.ts));
        return;
      }
    }
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day,precipitation,cloud_cover,uv_index,pressure_msl,wind_direction_10m' +
      '&hourly=temperature_2m,weather_code,is_day' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset' +
      '&wind_speed_unit=ms&timezone=Europe%2FChisinau&forecast_days=5';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 15000;
    xhr.onload = function () {
      try {
        var j = JSON.parse(xhr.responseText), c = j.current, dl = j.daily, hh = j.hourly;
        var ct = String(c.time).slice(0, 13), ci = 0, k, hr = [], dy = [];
        for (k = 0; k < hh.time.length; k++) { if (hh.time[k].slice(0, 13) >= ct) { ci = k; break; } }
        for (k = 0; k < 6 && ci + k < hh.time.length; k++) {
          hr.push([hh.weather_code[ci + k], hh.temperature_2m[ci + k], hh.is_day[ci + k] === 1, hh.time[ci + k].slice(11, 16)]);
        }
        for (k = 0; k < dl.time.length && k < 5; k++) {
          dy.push([dl.time[k], dl.weather_code[k], dl.temperature_2m_max[k], dl.temperature_2m_min[k]]);
        }
        var arr = [c.weather_code, c.temperature_2m, c.apparent_temperature,
                   c.relative_humidity_2m, c.wind_speed_10m, c.is_day === 1,
                   c.precipitation, c.cloud_cover, c.uv_index, c.pressure_msl, c.wind_direction_10m,
                   dl.temperature_2m_max[0], dl.temperature_2m_min[0],
                   dl.sunrise[0].slice(11, 16), dl.sunset[0].slice(11, 16), hr, dy];
        dataTs = Date.now();
        applyWeather.apply(null, arr);
        saveCache(arr);
        setTimeout(loadWeather, REFRESH_MIN * 60000);
      } catch (e) { failed(); }
    };
    xhr.onerror = failed;
    xhr.ontimeout = failed;
    xhr.send();
  }
  function failed() {
    if (!weather.ok) { setT('temp', '--°'); setT('desc', 'нет данных о погоде'); }
    setTimeout(loadWeather, 60000);
  }

  /* ---------- анимированный фон ---------- */
  var canvas = $('bg');
  var ctx = canvas.getContext('2d');
  var W = SW, H = SH;
  var particles = [], blobs = [], stars = [];
  var flash = 0, nextFlash = 0;
  var view = { cat: 'clouds', day: true };
  var layer = 0, pending = false;
  var curCols = null;
  var FADE_SEC = 1.2;
  function requestScene() {
    if (weather.cat !== view.cat || weather.day !== view.day) pending = true;
  }
  function hex2rgb(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  function rgbStr(a) { return 'rgb(' + Math.round(a[0]) + ',' + Math.round(a[1]) + ',' + Math.round(a[2]) + ')'; }

  var THEMES = {
    clear_day:    ['#1561d6', '#86ccff'],
    clear_night:  ['#050c26', '#1a2f74'],
    clouds_day:   ['#2d5799', '#86aedd'],
    clouds_night: ['#0a1530', '#2a4068'],
    fog:          ['#4f6f95', '#a6bdd6'],
    rain:         ['#14274a', '#3f6196'],
    snow:         ['#25406b', '#8aaad0'],
    storm:        ['#0a0e22', '#2c3563']
  };
  function themeKey() {
    var c = weather.cat;
    if (c === 'clear') return weather.day ? 'clear_day' : 'clear_night';
    if (c === 'clouds') return weather.day ? 'clouds_day' : 'clouds_night';
    return c;
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }

  function makeSprite(w, h, rgb, shade, al) {
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var x = cv.getContext('2d'), n = Math.max(4, Math.round(w / 55)), i, t, r, px, py, g, base = h * 0.88;
    for (i = 0; i < n; i++) {
      t = i / (n - 1);
      r = h * (0.2 + 0.2 * Math.sin(Math.PI * t)) * rnd(0.85, 1.12);
      px = w * 0.14 + w * 0.72 * t;
      py = base - r * 0.92;
      g = x.createRadialGradient(px - r * 0.25, py - r * 0.3, r * 0.1, px, py, r * 1.05);
      g.addColorStop(0, 'rgba(' + rgb + ',' + al + ')');
      g.addColorStop(0.65, 'rgba(' + rgb + ',' + (al * 0.8) + ')');
      g.addColorStop(1, 'rgba(' + rgb + ',0)');
      x.fillStyle = g;
      x.beginPath(); x.arc(px, py, r * 1.05, 0, 6.283); x.fill();
    }
    x.globalCompositeOperation = 'source-atop';
    g = x.createLinearGradient(0, h * 0.3, 0, h * 0.92);
    g.addColorStop(0, 'rgba(' + shade + ',0)');
    g.addColorStop(1, 'rgba(' + shade + ',0.6)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    return cv;
  }
  function cloudCfg(c, day) {
    if (c === 'storm') return { n: 8, rgb: '40,44,72', sh: '8,10,26', a: 0.8, k: 1 };
    if (c === 'rain') return { n: 8, rgb: '118,136,168', sh: '30,44,78', a: 0.62, k: 1 };
    if (c === 'fog') return { n: 6, rgb: '228,234,242', sh: '150,166,188', a: 0.5, k: 1.5 };
    if (c === 'snow') return { n: 7, rgb: '226,236,248', sh: '110,136,176', a: 0.52, k: 1 };
    if (c === 'clouds') return day ? { n: 9, rgb: '236,243,253', sh: '74,100,150', a: 0.66, k: 1 }
                                   : { n: 9, rgb: '124,140,172', sh: '16,26,56', a: 0.55, k: 1 };
    return day ? { n: 4, rgb: '255,255,255', sh: '110,155,215', a: 0.5, k: 0.9 }
               : { n: 3, rgb: '150,166,204', sh: '24,38,86', a: 0.32, k: 0.9 };
  }

  function buildScene() {
    var c = view.cat, i, n, cfg, d, w, h;
    particles = []; blobs = []; stars = [];
    if (c === 'snow') {
      for (i = 0; i < 80; i++) particles.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(1.5, 4), vy: rnd(14, 32), ph: rnd(0, 6.28), sw: rnd(3, 8) });
    } else if (c === 'rain' || c === 'storm') {
      for (i = 0; i < 110; i++) particles.push({ x: rnd(0, W * 1.1), y: rnd(0, H), len: rnd(12, 24), vy: rnd(230, 380) });
    }
    cfg = cloudCfg(c, view.day);
    for (i = 0; i < cfg.n; i++) {
      d = (i + rnd(0, 0.8)) / cfg.n;
      w = Math.round((230 + d * 300) * cfg.k);
      h = Math.round(w * 0.4);
      blobs.push({ img: makeSprite(w, h, cfg.rgb, cfg.sh, cfg.a * (0.55 + 0.45 * d)),
        x: rnd(-w, W), y: rnd(-h * 0.2, H - h * 0.6), w: w, vx: 3 + d * 9 });
    }
    if (c === 'clear' && !view.day) {
      for (i = 0; i < 90; i++) stars.push({ x: rnd(0, W), y: rnd(0, H), r: rnd(0.6, 1.8), ph: rnd(0, 6.28), sp: rnd(0.5, 2) });
    }
    nextFlash = Date.now() + rnd(3000, 7000);
  }

  var last = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (t - last < 1000 / FPS) return;
    var dt = Math.min(0.1, (t - last) / 1000 || 0.033);
    last = t;

    var th = THEMES[themeKey()];
    var tgt = [hex2rgb(th[0]), hex2rgb(th[1])];
    if (!curCols) curCols = [tgt[0].slice(), tgt[1].slice()];
    var k = 1 - Math.exp(-dt / 1.0), q, n2;
    for (q = 0; q < 2; q++) for (n2 = 0; n2 < 3; n2++) curCols[q][n2] += (tgt[q][n2] - curCols[q][n2]) * k;

    if (pending) {
      layer -= dt / FADE_SEC;
      if (layer <= 0) {
        layer = 0;
        view.cat = weather.cat; view.day = weather.day;
        buildScene();
        pending = false;
      }
    } else if (layer < 1) {
      layer = Math.min(1, layer + dt / FADE_SEC);
    }

    ctx.globalAlpha = 1;
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgbStr(curCols[0])); g.addColorStop(1, rgbStr(curCols[1]));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var c = view.cat, i, p, b;
    ctx.globalAlpha = layer;

    if (c === 'clear' && view.day) {
      var pulse = 1 + 0.05 * Math.sin(t / 1600);
      var sx = W * SUN_X, sy = 112;
      var sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 380 * pulse);
      sg.addColorStop(0, 'rgba(255,240,170,0.7)');
      sg.addColorStop(0.22, 'rgba(255,226,140,0.32)');
      sg.addColorStop(1, 'rgba(255,226,140,0)');
      ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
    }

    for (i = 0; i < stars.length; i++) {
      p = stars[i];
      ctx.globalAlpha = layer * (0.45 + 0.55 * Math.abs(Math.sin(t / 1000 * p.sp + p.ph)));
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = layer;

    for (i = 0; i < blobs.length; i++) {
      b = blobs[i];
      b.x += b.vx * dt;
      if (b.x > W + 10) b.x = -b.w - 10;
      ctx.drawImage(b.img, b.x, b.y);
    }

    if (c === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      for (i = 0; i < particles.length; i++) {
        p = particles[i];
        p.y += p.vy * dt; p.ph += dt;
        var x = p.x + Math.sin(p.ph) * p.sw;
        if (p.y - p.r > H) { p.y = -p.r; p.x = rnd(0, W); }
        ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, 6.283); ctx.fill();
      }
    } else if (c === 'rain' || c === 'storm') {
      ctx.strokeStyle = 'rgba(190,215,255,0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (i = 0; i < particles.length; i++) {
        p = particles[i];
        p.y += p.vy * dt; p.x -= p.vy * dt * 0.18;
        if (p.y - p.len > H) { p.y = -p.len; p.x = rnd(0, W * 1.2); }
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.len * 0.18, p.y - p.len);
      }
      ctx.stroke();
    }

    if (c === 'storm') {
      var nowMs = Date.now();
      if (nowMs > nextFlash) { flash = 1; nextFlash = nowMs + rnd(4000, 9000); }
      if (flash > 0.02) {
        ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.55) + ')';
        ctx.fillRect(0, 0, W, H);
        flash *= 0.86;
      }
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- смена экранов ---------- */
  var SLIDE_SEC = parseInt(params.sec, 10) || SLIDE_SEC_DEFAULT;
  var slides = [$('s1'), $('s2')];
  var TOTAL = slides.length;
  var cur = 0;
  var updateReady = false;
  function showSlide(i) {
    cur = i;
    for (var j = 0; j < slides.length; j++) slides[j].className = (j === i) ? 'slide on' : 'slide';
    try { localStorage.setItem('ws_last_slide', String(i)); } catch (e) {}
  }

  if (params.slide === 'time') { showSlide(0); }
  else if (params.slide === 'weather') { showSlide(Math.min(TOTAL - 1, 1 + (parseInt(params.card, 10) || 0))); }
  else {
    var start = 0;
    try { start = localStorage.getItem('ws_last_slide') === '0' ? 1 : 0; } catch (e) {}
    if (start === 1 && !weather.ok && !loadCache()) start = 0;
    showSlide(start);
    setInterval(function () {
      var next = (cur + 1) % TOTAL;
      if (next > 0 && !weatherFresh()) next = 0;
      if (next === 0 && updateReady && navigator.onLine !== false) {
        location.replace(location.pathname + '?v=' + Date.now());
        return;
      }
      showSlide(next);
    }, SLIDE_SEC * 1000);
  }

  buildScene();
  requestAnimationFrame(frame);
  loadWeather();

  var bootDay = chisinauNow().getUTCDate();
  setInterval(function () {
    var d = chisinauNow();
    if (d.getUTCDate() !== bootDay && d.getUTCHours() >= 4 && navigator.onLine !== false && weatherFresh()) {
      location.reload();
    }
  }, 60000);

  var UPDATE_CHECK_MIN = 30;
  function checkUpdate() {
    try {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', location.pathname + '?chk=' + Date.now(), true);
      xhr.timeout = 15000;
      xhr.onload = function () {
        try {
          if (xhr.status !== 200) return;
          var lm = xhr.getResponseHeader('Last-Modified');
          if (!lm) return;
          var srv = new Date(lm).getTime();
          var mine = new Date(document.lastModified).getTime();
          if (isNaN(srv) || isNaN(mine)) return;
          var seen = localStorage.getItem('ws_upd');
          if (Math.abs(srv - mine) > 2000 && seen !== lm) {
            localStorage.setItem('ws_upd', lm);
            updateReady = true;
          }
        } catch (e) {}
      };
      xhr.send();
    } catch (e) {}
  }
  setTimeout(checkUpdate, 60000);
  setInterval(checkUpdate, UPDATE_CHECK_MIN * 60000);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
