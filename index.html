<script>
(function(){
var s=document.documentElement.style,pp=null;
var LA=46.84,LO=29.58,RD=Math.PI/180,TZ0="Europe/Chisinau";
function sunUTC0(y,m,d,rise){
 var lngH=LO/15,N=Math.round((Date.UTC(y,m,d)-Date.UTC(y,0,0))/864e5),t=N+((rise?6:18)-lngH)/24;
 var M=0.9856*t-3.289,L=(M+1.916*Math.sin(M*RD)+0.020*Math.sin(2*M*RD)+282.634)%360;
 var RA=Math.atan(0.91764*Math.tan(L*RD))/RD;RA=(RA+360)%360;
 RA+=Math.floor(L/90)*90-Math.floor(RA/90)*90;RA/=15;
 var sd=0.39782*Math.sin(L*RD),cd=Math.cos(Math.asin(sd));
 var cH=(Math.cos(90.833*RD)-sd*Math.sin(LA*RD))/(cd*Math.cos(LA*RD));
 var H=Math.acos(cH)/RD;if(rise)H=360-H;H/=15;
 var T=H+RA-0.06571*t-6.622,UT=((T-lngH)%24+24)%24;
 return Date.UTC(y,m,d)+UT*3600000;
}
function locMin(ms){var q=new Date(ms).toLocaleString("sv-SE",{timeZone:TZ0});return +q.slice(11,13)*60+ +q.slice(14,16);}
var W=null,AM=false;
try{
 var ls=new Date().toLocaleString("sv-SE",{timeZone:TZ0});
 var y=+ls.slice(0,4),mo=+ls.slice(5,7)-1,d=+ls.slice(8,10),m=+ls.slice(11,13)*60+ +ls.slice(14,16);
 var sr=locMin(sunUTC0(y,mo,d,true)),ss=locMin(sunUTC0(y,mo,d,false)),day,night;
 AM=m<720;
 if(m>=sr&&m<=ss){day=Math.min(1,Math.min(m-sr,ss-m)/60);night=0;}
 else{day=0;night=Math.min(1,(m<sr?sr-m:m-ss)/60);}
 W=[day,1-day-night,night];
}catch(e){}
if(!W){var hh=new Date().getHours();W=(hh>=7&&hh<19)?[1,0,0]:[0,0,1];}
window.earlyW=W;
var guess=W[1]>=0.35?"assets/zakat.mp4":(W[2]>=0.5?"assets/yasna_night.mp4":"assets/sunny.mp4");
var lv=null;
try{lv=localStorage.getItem("wx_last_vid");}catch(e){}
/* если последнее видео - "по времени суток" (солнце/закат/ночь), берём то, что подходит ПО ВРЕМЕНИ СЕЙЧАС */
if(!lv||lv==="assets/sunny.mp4"||lv==="assets/yasna_night.mp4"||lv==="assets/zakat.mp4")lv=guess;
window.earlyVid=lv;
/* затемнение, которое этому ролику нужно ПРЯМО СЕЙЧАС (дневные ролики ночью/в сумерки) —
   чтобы при старте не было светлой вспышки до загрузки погоды. Считается так же, как scrim ниже в основном скрипте. */
var nat=(lv==="assets/yasna_night.mp4"||lv==="assets/rain_night.mp4"||lv==="assets/storm_night.mp4"||lv==="assets/zakat.mp4");
var dop=Math.min(0.72,0.06+(nat?0:(W[2]*0.58+W[1]*0.22)));
var drgb=W[2]>=0.5?"5,11,44":(W[1]>0.2?(AM?"74,53,80":"42,23,64"):"5,11,44");
window.earlyDim={op:dop,rgb:drgb};
try{pp=localStorage.getItem("wx_poster_"+lv);}catch(e){}
if(pp){var dg="linear-gradient(rgba("+drgb+","+dop+"),rgba("+drgb+","+dop+"))";s.background=dg+" 0 0 / 100% 100% no-repeat,url("+pp+") 0 0 / 100% 100% no-repeat #0b1020";}
else{
 var g;
 if(W[1]>=0.35)g=AM?"linear-gradient(#3a4a7c,#e8a98a)":"linear-gradient(#2b2a5c,#d98a6a)";
 else if(W[2]>=0.5)g="linear-gradient(#050b2c,#14224f)";
 else g="linear-gradient(#3f86d6,#a9d3f5)";
 s.background=g;
}
})();
</script>

<style>
/* =====================================================================
  ШРИФТЫ — Apple SF Pro
  Положи 4 файла в папку  fonts/  рядом с index.html:

@font-face { font-family: "SF Pro Display"; font-weight: 400; font-style: normal; font-display: block;
  src: local("SF Pro Display Regular"), local("SFProDisplay-Regular"), url("fonts/SF-Pro-Display-Regular.woff2") format("woff2"); }
@font-face { font-family: "SF Pro Display"; font-weight: 500; font-style: normal; font-display: block;
  src: local("SF Pro Display Medium"), local("SFProDisplay-Medium"), url("fonts/SF-Pro-Display-Medium.woff2") format("woff2"); }
@font-face { font-family: "SF Pro Text"; font-weight: 500; font-style: normal; font-display: block;
  src: local("SF Pro Text Medium"), local("SFProText-Medium"), url("fonts/SF-Pro-Text-Medium.woff2") format("woff2"); }
@font-face { font-family: "SF Pro Text"; font-weight: 600; font-style: normal; font-display: block;
  src: local("SF Pro Text Semibold"), local("SFProText-Semibold"), url("fonts/SF-Pro-Text-Semibold.woff2") format("woff2"); }

:root {
  --f-disp: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;
  --f-text: "SF Pro Text",    -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif;

  /* ===== СТЕКЛО ПАНЕЛЕЙ (прозрачное, фон хорошо виден) =====
    --panel-tint: синяя заливка панели (0 = совсем прозрачное, .15 = заметная).
    --panel-blur: размытие фона под панелью (0px = фон абсолютно чёткий).
    Если текст плохо читается на светлом небе — увеличь tint (до .12–.15) или усиль text-shadow внизу CSS. */
  --panel-tint: .06;
  --panel-blur: 6px;

  --cdur: 600s;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { width: 1156px; height: 256px; overflow: hidden; }

body {
    position: relative;
        background: transparent;

/* =====================================================================
  СЛОИ (снизу вверх):
   0  SVG-небо (запасной фон, отключается когда играет видео)
   1-2 два видео-слота (кроссфейд между ними)
   3  scrim (лёгкое затемнение)
   4  слайды с панелями
  ===================================================================== */
.scene { position: absolute; left: 0; top: 0; width: 1156px; height: 256px; display: block; z-index: 0; }

/* ===== ВИДЕО: два слота, плавная смена и бесшовный цикл ===== */
.vid {
    position: absolute; left: 0; top: 0;
    width: 1156px; height: 256px;
    object-fit: cover;
    opacity: 0;
    z-index: 1;
    pointer-events: none;
    background: transparent;
  
}

#lightRain { position: absolute; left: 0; top: 0; width: 1156px; height: 256px; z-index: 3; pointer-events: none; opacity: 0; transition: opacity 2.5s ease; }
#scrim {
    position: absolute; left: 0; top: 0; width: 1156px; height: 256px;
    background: #050b2c; opacity: .06; transition: opacity 3s ease; pointer-events: none;

}

/* ===== слайды: сам слайд НЕ меняет прозрачность (иначе ломается backdrop-filter),
   плавно появляются/исчезают панели внутри ===== */
.slide {
    position: absolute; left: 0; top: 0; width: 1156px; height: 256px;
    z-index: 4; pointer-events: none;
    visibility: hidden;
    transition: visibility 0s linear .8s;      /* скрыть после того как панели погасли */
}
.slide.on { visibility: visible; transition-delay: 0s; }
.slide .card { opacity: 0; transition: opacity .25s ease; }
.slide.on .card { opacity: 1; }

/* ===== анимации SVG-неба ===== */
.fx { transition: opacity 3s ease; }
@keyframes rainfall { from { transform: translate(0,-24px); } to { transform: translate(-16px,276px); } }
@keyframes rainfall2 { from { transform: translate(0,-30px); } to { transform: translate(-80px,276px); } }

.tw { animation: twinkle 3s ease-in-out infinite; }
@keyframes strike {
    0%,84%,100% { opacity: 0; }
    85%   { opacity: 1; }
    86.5% { opacity: .15; }
    88%   { opacity: .95; }
    90%   { opacity: .3; }
    92%   { opacity: .75; }
    96%   { opacity: 0; }
}
.bolt { opacity: 0; animation: strike 7s linear infinite; }

#fxSun { transition: opacity 3s ease, transform 3s ease; }
@keyframes spin    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes breathe { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.09); } }

@keyframes bankmove { from { transform: translateX(-140px); } to { transform: translateX(140px); } }
@keyframes splash  { 0% { opacity: .75; transform: scale(.2); } 100% { opacity: 0; transform: scale(4,2); } }

    0%      { opacity: 0; transform: translate(0,0); }
    1%      { opacity: 1; }
    4.5%    { opacity: 0; transform: translate(-240px,120px); }
    100%    { opacity: 0; transform: translate(-240px,120px); }
}
.spin    { transform-box: fill-box; transform-origin: center; animation: spin 180s linear infinite; }
.breathe { transform-box: fill-box; transform-origin: center; animation: breathe 7s ease-in-out infinite; }
.sw      { animation: sway 3s ease-in-out infinite alternate; }

.stat .lb, .stat .vl, .fc .tm, .fc .tp {

.stat .lb, .fc .tm, #hdr { color: rgba(255,255,255,.92); }

#c2a { left: 28px; top: 36px; width: 1100px; height: 184px; }

        cur2.time = n;

        d2.current = cur2;
        applyBg(d2);
    } catch (e) {}
}, 60 * 1000);

/* диагностика: открой страницу с ?debug в конце адреса */
if (location.search.indexOf("debug") > -1) {
    var dbg = document.createElement("pre");
    dbg.style.cssText = "position:absolute;left:8px;bottom:4px;z-index:99;margin:0;font:12px monospace;color:#fff;background:rgba(0,0,0,.7);padding:4px 6px;white-space:pre";
    document.body.appendChild(dbg);
    var fontInfo = "";
    var chk = ['500 20px "SF Pro Display"','400 20px "SF Pro Display"','600 20px "SF Pro Text"','500 20px "SF Pro Text"'];
    Promise.all(chk.map(function (f) {
        return document.fonts.load(f).then(function (a) { return f + (a.length ? "  OK" : "  НЕТ ФАЙЛА"); }, function () { return f + "  ОШИБКА ЗАГРУЗКИ"; });
    })).then(function (r) { fontInfo = r.join("\n"); });
    setInterval(function () {
        var v = VID.cur >= 0 ? VID.slots[VID.cur] : null;
       dbg.textContent = "открыта: " + Math.round((Date.now() - T0) / 1000) + " с\n" + "окно: " + window.innerWidth + "x" + window.innerHeight + "  dpr " + window.devicePixelRatio + "  экран: " + screen.width + "x" + screen.height + "\n" + fontInfo + "\n" + lastWx + "\nvideo: " + (VID.file || "нет (SVG-небо)")
            + (v ? "  x" + v.playbackRate.toFixed(2) + "  t=" + v.currentTime.toFixed(1) + "/" + (v.duration || 0).toFixed(1) + "  " + v.videoWidth + "x" + v.videoHeight : "")
            + (VID.busy ? "  [переход]" : "")
            + "\nжурнал (код|файл):\n" + VID.log.join("\n");
    }, 500);
}

/* =====================================================================
   АВТООБНОВЛЕНИЕ: раз в минуту смотрим, не изменился ли index.html на
   сервере (GitHub Pages). Если изменился — плавно гасим экран и
   перезагружаем страницу САМИ. Ничего нажимать не нужно.
   Подробности в консоли (F12 -> Console), строки "[update]".
   ===================================================================== */
(function () {
    if (location.search.indexOf("noupdate") > -1) return;
    var CHECK_EVERY = 60 * 1000;       // как часто проверять
    var base = null, updating = false, unsure = false;

    function log() { try { console.log.apply(console, ["[update]"].concat([].slice.call(arguments))); } catch (e) {} }
    function hash(s) {
        var h = 5381, i = s.length;
        while (i) h = (h * 33) ^ s.charCodeAt(--i);
        return (h >>> 0) + ":" + s.length;
    }
    function get(cb, fail) {
        var x = new XMLHttpRequest();
        // уникальный ?chk=... обходит кэш браузера, GitHub Pages и service worker
        x.open("GET", location.pathname + "?chk=" + new Date().getTime(), true);
        x.timeout = 15000;
        x.onreadystatechange = function () {
            if (x.readyState !== 4) return;
            if (x.status !== 200 || x.responseText.length < 1000) { log("ошибка проверки", x.status); if (fail) fail(); return; }
            cb(hash(x.responseText));
        };
        x.send();
    }
    function applyUpdate() {
        if (updating) return;
        updating = true;
        log("найдена новая версия — перезагружаю");
        var went = false;
        function go() {
            if (went) return;
            went = true;
            try { document.body.style.transition = "opacity .6s"; document.body.style.opacity = "0"; } catch (e) {}
            setTimeout(function () { location.reload(); }, 700);
        }
        // сначала кладём СВЕЖУЮ копию в кэш браузера, иначе перезагрузка может взять старую
        try { fetch(location.pathname, { cache: "reload" }).then(go, go); } catch (e) { go(); }
        setTimeout(go, 5000);
    }
    // хэш копии страницы из кэша (то, с чем страница реально была запущена без интернета)
    function cachedHash(cb) {
        try {
            caches.match(location.href).then(function (r) { return r || caches.match("index.html"); })
                .then(function (r) { return r ? r.text() : ""; })
                .then(function (t) { cb(t ? hash(t) : null); }, function () { cb(null); });
        } catch (e) { cb(null); }
    }
    function check() {
        get(function (h) {
            if (base === null) {
                if (!unsure) { base = h; log("проверка", h, "(эталон)"); return; }
                // страница была запущена БЕЗ интернета: эталон — копия из кэша, а не то, что лежит на сервере сейчас
                cachedHash(function (c) {
                    base = c || h;
                    log("интернет вернулся, сравниваю с кэшем", c, h);
                    if (h !== base) applyUpdate();
                });
                return;
            }
            log("проверка", h, h === base ? "без изменений" : "ИЗМЕНИЛАСЬ");
            if (h !== base) applyUpdate();
        }, function () { if (base === null) unsure = true; });
    }
    check();                              // запоминаем «эталон» сразу после загрузки
    setInterval(check, CHECK_EVERY);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });

    // офлайн-кэш (sw.js лежит рядом)
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
        navigator.serviceWorker.register("sw.js").catch(function () {});
        navigator.serviceWorker.addEventListener("message", function (e) {
            if (e.data && e.data.type === "cache") log("офлайн-кэш: " + e.data.cached + " из " + e.data.total + " файлов");
        });
        navigator.serviceWorker.ready.then(function (reg) {
            function ping() { if (reg.active) reg.active.postMessage({ type: "precache", first: VID.file });}
                        setTimeout(ping, 60000);
            setInterval(ping, 10 * 60 * 1000);
        });
    }
})();
</script>
